<!doctype html>
<html lang="en">

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FBFAF8;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div

      data-composition-id="main"

      data-duration="50.5"
      data-width="1920"

        class="scene"

        data-track-index="9003"

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-02-platform", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 10);
        tl.fromTo("#el-03-fee", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 10);
        tl.to("#el-03-fee", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 17);
        tl.fromTo("#el-04-direct", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 17);
        tl.to("#el-04-direct", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 22);
        tl.fromTo("#el-05-booking", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 22);
        tl.to("#el-05-booking", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 31);
        tl.fromTo("#el-06-kept", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 31);
        tl.to("#el-06-kept", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 38);
        tl.fromTo("#el-07-rules", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 38);
        tl.to("#el-07-rules", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 43);
        tl.fromTo("#el-08-identity", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 43);
        tl.to("#el-08-identity", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 47);
        tl.fromTo("#el-09-logo", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 47);
        tl.to({}, { duration: 50.5 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
